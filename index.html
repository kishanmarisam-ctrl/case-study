<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Verification Required</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            color: #0f0;
            font-family: "Courier New", monospace;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ── Landing screen ── */
        #landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            text-align: center;
        }

        #landing h1 {
            color: #0f0;
            font-size: clamp(18px, 5vw, 26px);
            letter-spacing: 2px;
        }

        #verify-btn {
            padding: 20px 40px;
            font-family: "Courier New", monospace;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: bold;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        #verify-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        #verify-btn:active { transform: scale(0.97); }

        /* ── Alarm screen ── */
        #alarm-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
            gap: 16px;
        }

        .warning {
            color: #f00;
            font-weight: bold;
            font-size: clamp(22px, 6vw, 32px);
            animation: blink 0.5s infinite;
            text-align: center;
            letter-spacing: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.2; }
        }

        .info-text {
            color: #0f0;
            font-size: 14px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 18px;
            border: 2px solid #f00;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #f00;
            animation: fill-pulse 1.2s ease-in-out infinite alternate;
        }

        @keyframes fill-pulse {
            0%   { width: 30%; opacity: 0.6; }
            100% { width: 100%; opacity: 1; }
        }

        #console-log {
            width: 100%;
            font-size: 12px;
            line-height: 1.7;
            color: #0f0;
            overflow-wrap: anywhere;
        }

        #status {
            color: #aaa;
            font-size: 12px;
        }



        @media (prefers-reduced-motion: reduce) {
            .warning, .progress-fill { animation: none; }
            .progress-fill { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ── Landing: shown on first load ── -->
    <div id="landing">
        <h1>⚠ SYSTEM VERIFICATION ⚠</h1>
        <button id="verify-btn" type="button">CLICK TO VERIFY</button>
    </div>

    <!-- ── Alarm screen: shown after click ── -->
    <div id="alarm-screen" role="alert" aria-live="assertive">
        <div class="warning" id="warning-text">⚠ CRITICAL KERNEL FAILURE ⚠</div>

        <p class="info-text">Memory corruption detected. Emergency recovery initiated.</p>
        <p class="info-text">Executing simulated thermal purge — DO NOT CLOSE THIS PAGE</p>

        <div class="progress-bar" aria-hidden="true">
            <div class="progress-fill" id="fill"></div>
        </div>

        <div id="console-log"></div>

        <p id="status" role="status">Alarm active.</p>
    </div>

    <script>
        "use strict";

        const landing      = document.getElementById("landing");
        const verifyBtn    = document.getElementById("verify-btn");
        const alarmScreen  = document.getElementById("alarm-screen");
        const consoleLog   = document.getElementById("console-log");
        const status       = document.getElementById("status");

        const NAV_LOCK_MS  = 5000; // ms — navigation locked after start

        const logs = [
            "[SIMULATION] Memory integrity check failed",
            "[SIMULATION] Storage scan started...",
            "[SIMULATION] Thermal threshold exceeded",
            "[SIMULATION] Recovery partition detected",
            "[SIMULATION] Diagnostic sequence running...",
            "[SIMULATION] System integrity check pending",
            "[SIMULATION] Emergency recovery initialized",
            "[SIMULATION] Hardware status check running",
            "[SIMULATION] Critical error — recovery mode active",
            "[SIMULATION] Sector wipe in progress..."
        ];

        let active        = false;
        let navLocked     = false;
        let startedAt     = 0;

        let audioContext  = null;
        let oscillator    = null;
        let gainNode      = null;
        let lfoOscillator = null;
        let lfoGain       = null;

        let logTimer      = null;
        let vibrationTimer = null;
        let navLockTimer  = null;

        // ── Navigation lock (5 seconds) ───────────────────────────────────
        function handleBeforeUnload(e) {
            e.preventDefault();
            e.returnValue = "";
            return "";
        }

        function lockNavigation() {
            navLocked = true;
            window.addEventListener("beforeunload", handleBeforeUnload);
            navLockTimer = setTimeout(unlockNavigation, NAV_LOCK_MS);
        }

        function unlockNavigation() {
            if (!navLocked) return;
            navLocked = false;
            window.removeEventListener("beforeunload", handleBeforeUnload);
            if (navLockTimer !== null) { clearTimeout(navLockTimer); navLockTimer = null; }
        }

        // ── Logging ───────────────────────────────────────────────────────
        function addLog(message) {
            const line = document.createElement("div");
            line.textContent = new Date().toLocaleTimeString() + " " + message;
            consoleLog.prepend(line);
            while (consoleLog.children.length > 12) consoleLog.lastElementChild.remove();
        }

        // ── Audio: continuous LFO-swept sawtooth at max gain ──────────────
        async function startAlarm() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) { status.textContent = "Audio not supported."; return; }

                audioContext = new AC();
                if (audioContext.state === "suspended") await audioContext.resume();
                if (!active) { await stopAudio(); return; }

                // Primary sawtooth oscillator — aggressive alarm tone
                oscillator = audioContext.createOscillator();
                gainNode   = audioContext.createGain();
                oscillator.type = "sawtooth";
                oscillator.frequency.setValueAtTime(1000, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.9, audioContext.currentTime);

                // LFO: sweeps pitch 800 Hz ↔ 1200 Hz at 8 Hz — siren effect
                lfoOscillator = audioContext.createOscillator();
                lfoGain       = audioContext.createGain();
                lfoOscillator.type = "sine";
                lfoOscillator.frequency.setValueAtTime(8, audioContext.currentTime);
                lfoGain.gain.setValueAtTime(200, audioContext.currentTime);

                lfoOscillator.connect(lfoGain);
                lfoGain.connect(oscillator.frequency);
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                // Both oscillators run indefinitely — no stop time set
                oscillator.start();
                lfoOscillator.start();

                status.textContent = "⚠ Alarm active — continuous.";
            } catch (err) {
                console.error("Audio failed:", err);
                status.textContent = "Audio blocked. Try enabling audio in browser.";
            }
        }

        async function stopAudio() {
            const oldOsc  = oscillator,  oldLfo  = lfoOscillator;
            const oldGain = gainNode,    oldLGain = lfoGain;
            const oldCtx  = audioContext;

            oscillator = lfoOscillator = gainNode = lfoGain = audioContext = null;

            for (const n of [oldOsc, oldLfo]) {
                if (n) { try { n.stop(); } catch (_) {} try { n.disconnect(); } catch (_) {} }
            }
            for (const n of [oldGain, oldLGain]) {
                if (n) { try { n.disconnect(); } catch (_) {} }
            }
            if (oldCtx) { try { await oldCtx.close(); } catch (_) {} }
        }

        // ── Vibration: truly continuous ────────────────────────────────────
        // Short pattern [300, 50] re-fired every 200 ms. Each new call to
        // navigator.vibrate() cancels the previous pattern and starts fresh,
        // so the phone never stops buzzing. 200 ms interval < 350 ms pattern
        // duration — guaranteed overlap = no gaps.
        const VIB = [300, 50];

        function startVibration() {
            if (typeof navigator.vibrate !== "function") return;
            navigator.vibrate(VIB);
            vibrationTimer = setInterval(() => {
                navigator.vibrate(VIB); // always fire — active check removed
            }, 200);                    // shorter than pattern = no gaps
        }

        function stopVibration() {
            if (vibrationTimer !== null) { clearInterval(vibrationTimer); vibrationTimer = null; }
            if (typeof navigator.vibrate === "function") navigator.vibrate(0);
        }

        // ── Stop everything ───────────────────────────────────────────────
        async function stopSimulation() {
            if (!active) return;
            active = false;

            if (logTimer !== null) { clearInterval(logTimer); logTimer = null; }
            stopVibration();
            unlockNavigation();
            await stopAudio();

            alarmScreen.style.display = "none";
            landing.style.display     = "flex";
            verifyBtn.textContent     = "CLICK TO VERIFY AGAIN";

            status.textContent = "Alarm stopped.";
        }

        // ── Start everything ──────────────────────────────────────────────
        async function startSimulation() {
            if (active) return;
            active    = true;
            startedAt = Date.now();

            // Swap screens
            landing.style.display     = "none";
            alarmScreen.style.display = "flex";

            consoleLog.replaceChildren();
            status.textContent = "Initializing...";
            addLog("[SIMULATION] Verification accepted.");

            // Lock navigation for 5 seconds
            lockNavigation();

            // Fullscreen — non-blocking, do NOT await (avoids visibilitychange race)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            // Continuous alarm — runs until stopAudio() is called
            await startAlarm();
            if (!active) return;

            // Continuous vibration — runs until stopVibration() is called
            startVibration();

            // Continuous log spam
            logTimer = setInterval(() => {
                if (!active) return;
                if (Math.random() > 0.4) {
                    addLog(logs[Math.floor(Math.random() * logs.length)]);
                }
            }, 800);
        }

        // ── Wire-up ───────────────────────────────────────────────────────
        // No stop button. No visibilitychange handler — screen dimming or
        // app-switching must NOT interrupt the alarm. Only pagehide cleans up.
        verifyBtn.addEventListener("click", startSimulation);

        // Hard cleanup on unload
        window.addEventListener("pagehide", () => {
            active = false;
            if (logTimer) clearInterval(logTimer);
            stopVibration();
            if (oscillator)    { try { oscillator.stop(); }    catch (_) {} }
            if (lfoOscillator) { try { lfoOscillator.stop(); } catch (_) {} }
            if (audioContext)  { audioContext.close().catch(() => {}); }
        });
    </script>
</body>
</html>
